:root {
  --bg: #f7f9fc;
  --surface: #ffffff;
  --surface-soft: #eef4ff;
  --text: #172033;
  --muted: #667085;
  --line: #d9e1ef;
  --primary: #174ea6;
  --primary-2: #0b7fab;
  --accent: #2f80ed;
  --success: #0f766e;
  --shadow: 0 18px 45px rgba(15, 23, 42, 0.10);
  --radius: 22px;
  --max: 1160px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans KR", sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.65;
}

a {
  color: var(--primary);
  text-decoration: none;
}

a:hover { text-decoration: underline; }

.container {
  width: min(var(--max), calc(100% - 40px));
  margin: 0 auto;
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(16px);
  background: rgba(255, 255, 255, 0.82);
  border-bottom: 1px solid rgba(217, 225, 239, 0.8);
}

.navbar {
  min-height: 74px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text);
  font-weight: 800;
  letter-spacing: -0.02em;
}

.brand-mark {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  display: grid;
  place-items: center;
  color: white;
  font-weight: 900;
  box-shadow: 0 10px 22px rgba(23, 78, 166, 0.25);
}

.brand small {
  display: block;
  color: var(--muted);
  font-size: 0.76rem;
  font-weight: 600;
  letter-spacing: 0;
  margin-top: -3px;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 6px;
}

.nav-links a {
  color: #344054;
  font-weight: 650;
  font-size: 0.95rem;
  padding: 10px 12px;
  border-radius: 999px;
}

.nav-links a:hover,
.nav-links a.active {
  color: var(--primary);
  background: #edf4ff;
  text-decoration: none;
}

.menu-button {
  display: none;
  border: 1px solid var(--line);
  background: white;
  color: var(--text);
  border-radius: 12px;
  padding: 9px 12px;
  font-weight: 700;
}

.hero {
  position: relative;
  overflow: hidden;
  padding: 86px 0 76px;
  background:
    radial-gradient(circle at 15% 20%, rgba(47, 128, 237, 0.18), transparent 30%),
    radial-gradient(circle at 85% 10%, rgba(15, 118, 110, 0.16), transparent 32%),
    linear-gradient(180deg, #ffffff 0%, #f7f9fc 100%);
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 46px;
  align-items: center;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #eaf2ff;
  color: var(--primary);
  border: 1px solid #cfe0ff;
  border-radius: 999px;
  padding: 7px 12px;
  font-weight: 800;
  font-size: 0.86rem;
}

.hero h1,
.page-hero h1 {
  margin: 18px 0 18px;
  font-size: clamp(2.45rem, 6vw, 5rem);
  line-height: 0.98;
  letter-spacing: -0.06em;
}

.hero p {
  max-width: 760px;
  color: var(--muted);
  font-size: 1.13rem;
  margin: 0 0 26px;
}

.cta-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  padding: 12px 18px;
  font-weight: 800;
  border: 1px solid transparent;
  text-decoration: none;
}

.btn.primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  color: white;
  box-shadow: 0 14px 24px rgba(23, 78, 166, 0.24);
}

.btn.secondary {
  background: white;
  color: var(--text);
  border-color: var(--line);
}

.btn:hover { text-decoration: none; transform: translateY(-1px); }

.hero-card {
  background: rgba(255,255,255,0.82);
  border: 1px solid rgba(217,225,239,0.85);
  border-radius: 30px;
  padding: 28px;
  box-shadow: var(--shadow);
}

.hero-card h3 { margin-top: 0; font-size: 1.15rem; }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin-top: 18px;
}

.stat {
  background: #f8fbff;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
}

.stat b {
  display: block;
  font-size: 1.55rem;
  letter-spacing: -0.04em;
}

.section {
  padding: 68px 0;
}

.section-header {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 26px;
}

.section-header h2,
.page-section h2 {
  margin: 0;
  font-size: clamp(1.8rem, 3.5vw, 2.55rem);
  letter-spacing: -0.04em;
  line-height: 1.08;
}

.section-header p {
  max-width: 620px;
  margin: 0;
  color: var(--muted);
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 26px;
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.05);
}

.card h3 {
  margin: 0 0 10px;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.card p { color: var(--muted); margin: 0; }

.tag-list {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 18px;
}

.tag {
  border: 1px solid #cfe0ff;
  color: var(--primary);
  background: #f1f6ff;
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 0.84rem;
  font-weight: 750;
}

.news-list {
  display: grid;
  gap: 12px;
}

.news-item {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 18px;
  padding: 18px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 18px;
}

.news-date {
  color: var(--primary);
  font-weight: 850;
}

.page-hero {
  padding: 62px 0 38px;
  background: linear-gradient(180deg, #ffffff 0%, #f7f9fc 100%);
  border-bottom: 1px solid var(--line);
}

.page-hero p {
  max-width: 820px;
  color: var(--muted);
  font-size: 1.08rem;
}

.page-section {
  padding: 52px 0;
}

.profile {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 28px;
  align-items: start;
}

.avatar {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 28px;
  background: linear-gradient(135deg, #dbeafe, #ccfbf1);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  color: var(--primary);
  font-size: 3rem;
  font-weight: 900;
}

.people-list {
  display: grid;
  gap: 14px;
}

.person-row {
  background: white;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px;
}

.person-row h3 { margin: 0; }
.role { color: var(--primary); font-weight: 800; margin: 2px 0 8px; }
.muted { color: var(--muted); }

.pub-list {
  display: grid;
  gap: 13px;
  counter-reset: pubs;
}

.pub {
  position: relative;
  background: white;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px 18px 18px 58px;
}

.pub::before {
  counter-increment: pubs;
  content: counter(pubs);
  position: absolute;
  left: 18px;
  top: 19px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #edf4ff;
  color: var(--primary);
  display: grid;
  place-items: center;
  font-size: 0.82rem;
  font-weight: 900;
}

.pub-title { font-weight: 850; color: var(--text); }
.pub-meta { color: var(--muted); margin-top: 4px; }

.contact-box {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.footer {
  border-top: 1px solid var(--line);
  padding: 32px 0;
  color: var(--muted);
  background: white;
}

.footer-grid {
  display: flex;
  justify-content: space-between;
  gap: 20px;
}

ul.clean {
  margin: 12px 0 0;
  padding-left: 20px;
}

@media (max-width: 900px) {
  .hero-grid,
  .profile,
  .contact-box,
  .grid-2,
  .grid-3 {
    grid-template-columns: 1fr;
  }

  .section-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .menu-button { display: inline-flex; }

  .nav-links {
    display: none;
    width: 100%;
    flex-direction: column;
    align-items: stretch;
    padding-bottom: 14px;
  }

  .nav-links.open { display: flex; }

  .navbar {
    flex-wrap: wrap;
  }

  .nav-links a {
    padding: 12px 14px;
    background: #f8fafc;
  }

  .hero {
    padding-top: 58px;
  }

  .news-item {
    grid-template-columns: 1fr;
    gap: 4px;
  }

  .footer-grid {
    flex-direction: column;
  }
}
